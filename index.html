<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일해라</title>
  <style>
    body { font-family: sans-serif; max-width: 650px; margin: 20px auto; padding: 0 15px;background-color: rgb(30, 29, 29);}
    section {background-color: rgb(252, 249, 249); border: 1px solid #ccc; padding: 18px; border-radius: 8px; margin-bottom: 20px; }
    input, textarea, select { width: 100%; margin-bottom: 12px; padding: 10px; box-sizing: border-box; }
    button { padding: 10px 18px; cursor: pointer; font-weight: bold; }
    .post-card { border: 1px solid #eee; background: #fff; padding: 12px; margin-top: 10px; border-radius: 6px; }
    .badge { background: #ffeb3b; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .author-info { font-size: 13px; color: #666; margin-top: 2px; margin-bottom: 10px; }
    #userProfile { background: #e3f2fd; padding: 10px; border-radius: 6px; margin-bottom: 15px; display: none; }
  </style>
</head>
<body>

  <h1 style="color: rgb(245, 240, 242);">디지털 소외 해소 글을 POST하는 공간입니다.</h1>
  <strong style="color: rgb(251, 42, 108);">제발 UI같은거 직접 언급하면서 구체적으로 사용자가 따라갈 수 있게 글을 적고, <br> 되도록이면 카테고리 추가하지 마세요. 웬만한 건 이미 다 있음.</strong>


  <section>
    <h2>로그인</h2>
    <div id="loginArea">
      <button id="googleLoginBtn">구글 계정으로 로그인</button>
    </div>
    <div id="userProfile">
      <p style="margin:0;"><strong id="userName"></strong> (<span id="userEmail"></span>) 님 환영합니다!</p>
      <button id="logoutBtn" style="margin-top: 8px; padding: 4px 8px; font-size: 12px;">로그아웃</button>
    </div>
  </section>

  <section id="writeSection" style="display: none;">
    <h2> 새 Post 작성</h2>
    
    <label>카테고리</label>
<select id="categorySelect">
  <option value="키오스크">키오스크</option>
  <option value="예매 방법">예매 방법</option>
  <option value="모바일 앱 결제">모바일 앱 결제</option>
  <option value="PC앱 결제">PC앱 결제</option>
  <option value="direct">직접 입력</option>
</select>

<input type="text" id="customCategoryInput" placeholder="카테고리를 직접 입력하세요" style="display: none; margin-top: -5px;">

    <label>제목</label>
    <input type="text" id="titleInput" placeholder="제목을 입력하세요">

    <label>본문</label>
    <textarea id="bodyInput" rows="4" placeholder="내용을 입력하세요"></textarea>

    <button id="submitBtn">작성 완료 (검증 요청)</button>
  </section>

  <section id="adminSection" style="display: none; background-color: #fffde7;">
    <h2> [내 DB] 승인 대기 목록 (관리자 검증)</h2>
    <div id="pendingPosts">로딩 중...</div>
    </section>

  <section id="returnedSection" style="display: none; background-color: #fff8e1;">
    <h2>반환된 글 (수정 후 재제출)</h2>
    <div id="returnedPosts">로딩 중...</div>
  </section>

  <section style="background-color: #f1f8e9;">
    <h2>[메인 DB] 게시된 Post 목록</h2>
    <div id="publishedPosts">로딩 중...</div>
  </section>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      deleteDoc, 
      doc, 
      onSnapshot, 
      serverTimestamp,
      query,
      where
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    // 4. Realtime Database (친구 DB - 안드로이드 앱 글 수신용)
    import { 
      getDatabase, 
      ref, 
      onValue, 
      push, 
      remove 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    // Firebase 프로젝트 설정
    const myFirebaseConfig = {
        apiKey: "AIzaSyBxN9gTuUPZRmeE-PARNR8zDouqVkDuOPk",
        authDomain: "clepostinf.firebaseapp.com",
        projectId: "clepostinf",
        storageBucket: "clepostinf.firebasestorage.app",
        messagingSenderId: "4251713734",
        appId: "1:4251713734:web:cee443f29ace413cb097c7",
        measurementId: "G-WDPTRC2H9M"
    };

    // Main Firebase
    const friendFirebaseConfig = {
      apiKey: "AIzaSyAKPMun3QqXJ9T0F88sJmDVg4P41yfzalw",
      authDomain: "tlqkfzz.firebaseapp.com",
      databaseURL: "https://tlqkfzz-default-rtdb.firebaseio.com",
      projectId: "tlqkfzz",
      storageBucket: "tlqkfzz.appspot.com",
      messagingSenderId: "84615874589",
      appId: "1:84615874589:android:a6adda0376e3a83b145ef4"
    };
    const friendApp = initializeApp(friendFirebaseConfig, "friendApp");
    const friendRealtimeDb = getDatabase(friendApp);

    const postsRef = ref(friendRealtimeDb, 'posts');
    const categoriesRef = ref(friendRealtimeDb, 'categories'); // 안드로이드 앱과 공유하는 카테고리 목록

    let categoriesList = []; // Firebase에서 불러온 카테고리 캐시 (중복 추가 방지용)

    // Firebase 앱 & DB 초기화
    const myApp = initializeApp(myFirebaseConfig, "myApp");
    

    const auth = getAuth(myApp);
    const myDb = getFirestore(myApp);
    const friendDb = getFirestore(friendApp);

    let currentUser = null; // 현재 로그인된 사용자 정보 저장 변수

    // HTML 요소를 가져옵니다.
    const googleLoginBtn = document.getElementById('googleLoginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const loginArea = document.getElementById('loginArea');
    const userProfile = document.getElementById('userProfile');
    const userNameSpan = document.getElementById('userName');
    const userEmailSpan = document.getElementById('userEmail');
    const writeSection = document.getElementById('writeSection');

    const categoryInput = document.getElementById('categoryInput');
    const titleInput = document.getElementById('titleInput');
    const bodyInput = document.getElementById('bodyInput');
    const submitBtn = document.getElementById('submitBtn');

    const pendingPostsDiv = document.getElementById('pendingPosts');
    const publishedPostsDiv = document.getElementById('publishedPosts');
    const returnedSection = document.getElementById('returnedSection');
    const returnedPostsDiv = document.getElementById('returnedPosts');

    const categorySelect = document.getElementById('categorySelect');
    const customCategoryInput = document.getElementById('customCategoryInput');

    const ADMIN_EMAIL = "h_s_posan25_1219@dge.go.kr";

    const adminSection = document.getElementById('adminSection');

    let unsubscribePendingPosts = null; // 대기글 리스너 해제용 변수
    let unsubscribeReturnedPosts = null; // 반환글 리스너 해제용 변수

    // -------------------------------------------------------------
    // textarea에서 Enter 입력 시 커서 위치에 확실히 \n 삽입 (공용 헬퍼)
    // -------------------------------------------------------------
    function enableEnterNewline(textareaEl) {
      textareaEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          const start = this.selectionStart;
          const end = this.selectionEnd;
          const value = this.value;
          this.value = value.substring(0, start) + '\n' + value.substring(end);
          this.selectionStart = this.selectionEnd = start + 1;
        }
      });
    }

    // -------------------------------------------------------------
    // 저장된 \n 이 화면에도 줄바꿈으로 보이도록 변환 (+ XSS 방지용 이스케이프)
    // -------------------------------------------------------------
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatBody(str) {
      return escapeHtml(str).replace(/\n/g, '<br>');
    }

    enableEnterNewline(bodyInput);

// -------------------------------------------------------------
// 로그인 상태 변화 감지
// -------------------------------------------------------------
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        userNameSpan.textContent = user.displayName || "이름없음";
        userEmailSpan.textContent = user.email || "";
        loginArea.style.display = 'none';
        userProfile.style.display = 'block';
        writeSection.style.display = 'block';

        //  로그인한 유저가 관리자인지 체크!
        if (user.email === ADMIN_EMAIL) {
          adminSection.style.display = 'block'; // 관리자 UI 보이기
          listenToPendingPosts(); // 관리자일 때만 승인 대기글 수신 시작
        } else {
          adminSection.style.display = 'none'; // 일반 유저는 관리자 UI 숨기기
          if (unsubscribePendingPosts) unsubscribePendingPosts(); // 대기글 수신 중단
        }

        // 로그인한 사용자 본인에게 반환된 글 수신 시작 (관리자 포함 누구나)
        returnedSection.style.display = 'block';
        listenToReturnedPosts(user.uid);

      } else {
        currentUser = null;
        loginArea.style.display = 'block';
        userProfile.style.display = 'none';
        writeSection.style.display = 'none';
        adminSection.style.display = 'none'; // 로그아웃 시 관리자 UI 숨기기
        returnedSection.style.display = 'none';
        if (unsubscribePendingPosts) unsubscribePendingPosts();
        if (unsubscribeReturnedPosts) unsubscribeReturnedPosts();
      }
    });


    // -------------------------------------------------------------
    // [관리자 전용] 대기 중인 Post 목록 조회 함수
    // -------------------------------------------------------------
    function listenToPendingPosts() {
      // 이미 수신기가 켜져 있다면 중복 실행 방지
      if (unsubscribePendingPosts) unsubscribePendingPosts();

      unsubscribePendingPosts = onSnapshot(collection(myDb, "pending_posts"), (snapshot) => {
        pendingPostsDiv.innerHTML = '';
        if (snapshot.empty) {
          pendingPostsDiv.innerHTML = '<p>대기 중인 Post가 없습니다.</p>';
          return;
        }

        snapshot.forEach((docSnap) => {
          const post = docSnap.data();
          const postId = docSnap.id;

          const card = document.createElement('div');
          card.className = 'post-card';
          card.innerHTML = `
            <span class="badge">[${escapeHtml(post.category)}]</span> <strong>${escapeHtml(post.title)}</strong>
            <div class="author-info">작성자: ${escapeHtml(post.author)} (${escapeHtml(post.authEmail)})</div>
            <p>${formatBody(post.body)}</p>
            <div style="margin-top: 10px;">
              <button class="approve-btn" style="background-color: #e8f5e9; border: 1px solid #81c784; color: #2e7d32;">
                [승인하여 Main DB로 전송]
              </button>
              <button class="return-btn" style="background-color: #e3f2fd; border: 1px solid #64b5f6; color: #1565c0; margin-left: 8px;">
                [반환 (코멘트와 함께 돌려주기)]
              </button>
              <button class="reject-btn" style="background-color: #ffebee; border: 1px solid #e57373; color: #c62828; margin-left: 8px;">
                [거절 (대기 명단에서 삭제)]
              </button>
            </div>
          `;

          card.querySelector('.approve-btn').addEventListener('click', async () => {
            await approveAndTransfer(postId, post);
          });
          card.querySelector('.return-btn').addEventListener('click', async () => {
            const comment = prompt(`'${post.title}' 글을 작성자에게 반환합니다.\n작성자에게 남길 코멘트를 입력해주세요:`);
            if (comment === null) return; // 취소 누름
            await returnPostToUser(postId, post, comment.trim());
          });
          card.querySelector('.reject-btn').addEventListener('click', async () => {
            if (confirm(`'${post.title}' 글을 대기 목록에서 삭제하시겠습니까?`)) {
              await rejectPost(postId);
            }
          });

          pendingPostsDiv.appendChild(card);
        });
      });
    }
    async function rejectPost(myPostId) {
      try {
        await deleteDoc(doc(myDb, "pending_posts", myPostId));
        alert("게시글이 대기 목록에서 삭제되었습니다.");
      } catch (error) {
        console.error("거절/삭제 실패:", error);
        alert("삭제 중 오류가 발생했습니다.");
      }
    }

    // -------------------------------------------------------------
    // [관리자 전용] 코멘트와 함께 작성자에게 글 반환
    // 내 DB의 pending_posts -> returned_posts 로 이동 (uid로 작성자 구분)
    // -------------------------------------------------------------
    async function returnPostToUser(myPostId, postData, comment) {
      try {
        await addDoc(collection(myDb, "returned_posts"), {
          uid: postData.uid || "",
          author: postData.author || "",
          authEmail: postData.authEmail || "",
          title: postData.title || "",
          body: postData.body || "",
          category: postData.category || "",
          adminComment: comment || "",
          returnedAt: serverTimestamp()
        });

        await deleteDoc(doc(myDb, "pending_posts", myPostId));
        alert("작성자에게 반환되었습니다.");
      } catch (error) {
        console.error("반환 실패:", error);
        alert("반환 중 오류가 발생했습니다.");
      }
    }

    // -------------------------------------------------------------
    // [본인 전용] 반환된 글 목록 조회 + 수정 후 재제출
    // -------------------------------------------------------------
    function listenToReturnedPosts(uid) {
      if (unsubscribeReturnedPosts) unsubscribeReturnedPosts();

      const returnedQuery = query(collection(myDb, "returned_posts"), where("uid", "==", uid));

      unsubscribeReturnedPosts = onSnapshot(returnedQuery, (snapshot) => {
        returnedPostsDiv.innerHTML = '';
        if (snapshot.empty) {
          returnedPostsDiv.innerHTML = '<p>반환된 글이 없습니다.</p>';
          return;
        }

        snapshot.forEach((docSnap) => {
          const post = docSnap.data();
          const postId = docSnap.id;

          const card = document.createElement('div');
          card.className = 'post-card';
          card.innerHTML = `
            <div style="background:#fff3e0; padding:8px; border-radius:4px; margin-bottom:10px;">
              <strong>관리자 코멘트:</strong> ${escapeHtml(post.adminComment || '(코멘트 없음)')}
            </div>
            <label>카테고리</label>
            <input type="text" class="return-category-input" value="${escapeHtml(post.category || '')}">
            <label>제목</label>
            <input type="text" class="return-title-input" value="${escapeHtml(post.title || '')}">
            <label>본문</label>
            <textarea class="return-body-input" rows="4">${escapeHtml(post.body || '')}</textarea>
            <button class="resubmit-btn" style="background-color:#e8f5e9; border:1px solid #81c784; color:#2e7d32;">
              [수정 완료 - 다시 제출]
            </button>
          `;

          const categoryInputEl = card.querySelector('.return-category-input');
          const titleInputEl = card.querySelector('.return-title-input');
          const bodyInputEl = card.querySelector('.return-body-input');

          enableEnterNewline(bodyInputEl);

          card.querySelector('.resubmit-btn').addEventListener('click', async () => {
            const newCategory = categoryInputEl.value.trim();
            const newTitle = titleInputEl.value.trim();
            const newBody = bodyInputEl.value.trim();

            if (!newCategory || !newTitle || !newBody) {
              alert("카테고리, 제목, 내용을 모두 입력해주세요.");
              return;
            }

            try {
              await addDoc(collection(myDb, "pending_posts"), {
                uid: post.uid || "",
                author: post.author || "",
                authEmail: post.authEmail || "",
                title: newTitle,
                body: newBody,
                category: newCategory,
                status: "pending",
                starCount: 0,
                stars: {},
                createdAt: serverTimestamp()
              });

              // 새 카테고리라면 Firebase categories 노드에도 추가
              if (newCategory && !categoriesList.includes(newCategory)) {
                try {
                  await push(categoriesRef, newCategory);
                } catch (catError) {
                  console.error("카테고리 추가 실패:", catError);
                }
              }

              await deleteDoc(doc(myDb, "returned_posts", postId));
              alert("수정한 글이 다시 승인 대기 목록으로 제출되었습니다!");
            } catch (error) {
              console.error("재제출 실패:", error);
              alert("재제출 중 오류가 발생했습니다.");
            }
          });

          returnedPostsDiv.appendChild(card);
        });
      });
    }

    // -------------------------------------------------------------
    // Firebase 'categories' 노드를 실시간으로 읽어와 select 옵션 구성
    // (안드로이드 앱과 동일한 categories 노드를 공유)
    // -------------------------------------------------------------
    onValue(categoriesRef, (snapshot) => {
      const tempSelected = categorySelect.value; // 선택 상태 유지 시도

      categoriesList = [];
      const data = snapshot.val();
      if (data) {
        Object.keys(data).forEach((key) => {
          const cat = data[key];
          if (cat && !categoriesList.includes(cat)) {
            categoriesList.push(cat);
          }
        });
      }

      // select 옵션 다시 구성
      categorySelect.innerHTML = '';
      categoriesList.forEach((cat) => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        categorySelect.appendChild(opt);
      });

      // '직접 입력' 옵션은 항상 마지막에 추가
      const directOpt = document.createElement('option');
      directOpt.value = 'direct';
      directOpt.textContent = '직접 입력';
      categorySelect.appendChild(directOpt);

      // 이전 선택값 복원 (여전히 목록에 있으면 유지, 없으면 첫 항목)
      if (tempSelected === 'direct' || categoriesList.includes(tempSelected)) {
        categorySelect.value = tempSelected;
      } else if (categoriesList.length > 0) {
        categorySelect.value = categoriesList[0];
      }

      // '직접 입력'이 선택된 상태가 아니면 커스텀 입력창은 숨김 유지
      if (categorySelect.value !== 'direct') {
        customCategoryInput.style.display = 'none';
      }
    });

    categorySelect.addEventListener('change', (e) => {
      if (e.target.value === 'direct') {
        customCategoryInput.style.display = 'block';
        customCategoryInput.focus();
      } else {
        customCategoryInput.style.display = 'none';
        customCategoryInput.value = ''; // 입력창 초기화
      }
    });

    // 구글 로그인 / 로그아웃 처리
    const provider = new GoogleAuthProvider();

    googleLoginBtn.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        console.error("로그인 실패:", error);
        alert("로그인 중 오류가 발생했습니다.");
      }
    });

    logoutBtn.addEventListener('click', () => signOut(auth));


    //  Post 작성 (내 DB의 'pending_posts' 컬렉션에 저장)
    submitBtn.addEventListener('click', async () => {
      if (!currentUser) {
        alert("로그인이 필요합니다.");
        return;
      }

      const title = titleInput.value.trim();
      const body = bodyInput.value.trim();

      //  최종 카테고리 값 구하기
      let finalCategory = categorySelect.value;
      let isCustomCategory = false;
      if (finalCategory === 'direct') {
        finalCategory = customCategoryInput.value.trim();
        isCustomCategory = true;
      }

      if (!finalCategory) {
        alert("카테고리를 입력하거나 선택해주세요.");
        return;
      }

      if (!title || !body) {
        alert("제목과 내용을 입력해주세요.");
        return;
      }

      // Firestore에 저장할 Post 객체
      const postData = {
        uid: currentUser.uid,
        author: currentUser.displayName || "익명",
        authEmail: currentUser.email || "",
        title: title,
        body: body,
        category: finalCategory, // 입력받은 최종 카테고리 적용!
        status: "pending",
        starCount: 0,
        stars: {},
        createdAt: serverTimestamp()
      };

      try {
        await addDoc(collection(myDb, "pending_posts"), postData);

        // 직접 입력한 카테고리가 기존 목록에 없으면 Firebase categories 노드에 추가
        // (안드로이드 앱 필터 스피너에도 동일하게 반영됨)
        if (isCustomCategory && !categoriesList.includes(finalCategory)) {
          try {
            await push(categoriesRef, finalCategory);
          } catch (catError) {
            console.error("카테고리 추가 실패:", catError);
          }
        }

        alert("내 DB에 승인 대기글로 등록되었습니다!");

        // 입력 폼 초기화
        titleInput.value = '';
        bodyInput.value = '';
        customCategoryInput.value = '';
        if (categorySelect.options.length > 0) {
          categorySelect.selectedIndex = 0;
        }
        customCategoryInput.style.display = 'none';
      } catch (error) {
        console.error("글 저장 실패:", error);
      }
    });


    // -------------------------------------------------------------
    // 4. [내 DB] 대기 중인 Post 목록 조회 및 승인/반환/거절 처리
    //    (실제 조회/렌더링은 관리자 로그인 시 listenToPendingPosts()에서 수행)
    // -------------------------------------------------------------

    // 승인 함수: 내 DB에서 삭제 후 -> 친구 DB의 'posts' 컬렉션에 이관
    async function approveAndTransfer(myPostId, postData) {
      try {
        // 1. 전송할 데이터 안전하게 구성 (undefined 방지 및 author 변경)
        const approvedPost = {
          uid: postData.uid || "",
          author: "관리자", //  작성자를 '관리자'로 변경
          authEmail: postData.authEmail || "",
          title: postData.title || "",
          body: postData.body || "",
          category: postData.category || "기타",
          status: "approved",
          createdAt: Date.now() //  Realtime DB용 숫자 타임스탬프
        };
      
        // 2. 친구 Realtime DB의 'posts' 경로로 전송
        const friendPostsRef = ref(friendRealtimeDb, 'posts');
        await push(friendPostsRef, approvedPost);
      
        // 3. 내 Firestore DB의 대기 목록에서 삭제
        await deleteDoc(doc(myDb, "pending_posts", myPostId));
      
        alert("성공적으로 승인되어 게시되었습니다!");
      } catch (error) {
        console.error("이관 실패 상세 원인:", error);
        alert(`승인 이관 중 오류 발생: ${error.message}`);
      }
    }


    // -------------------------------------------------------------
    // 5. [친구 DB] 최종 승인/게시된 Post 목록 불러오기
    // -------------------------------------------------------------
    onValue(postsRef, (snapshot) => {
      publishedPostsDiv.innerHTML = '';
      const data = snapshot.val();

      if (!data) {
        publishedPostsDiv.innerHTML = '<p>게시된 Post가 없습니다.</p>';
        return;
      }

      // Realtime Database의 객체 형태 데이터를 반복문 처리
      Object.keys(data).forEach((key) => {
        const post = data[key];

        publishedPostsDiv.innerHTML += `
          <div class="post-card">
            <span class="badge">[${escapeHtml(post.category || '기타')}]</span> <strong>${escapeHtml(post.title || '제목 없음')}</strong>
            <div class="author-info">작성자: ${escapeHtml(post.author || '익명')}</div>
            <p>${formatBody(post.body || '')}</p>
          </div>
        `;
      });
    });
  </script>
</body>
