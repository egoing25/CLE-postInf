<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일해라</title>
  <style>
    body { font-family: sans-serif; max-width: 650px; margin: 20px auto; padding: 0 15px;background-color: rgb(30, 29, 29);}
    section {background-color: rgb(252, 249, 249); border: 1px solid #ccc; padding: 18px; border-radius: 8px; margin-bottom: 20px; }
    input, textarea, select { width: 100%; margin-bottom: 12px; padding: 10px; box-sizing: border-box; }
    button { padding: 10px 18px; cursor: pointer; font-weight: bold; }
    .post-card { border: 1px solid #eee; background: #fff; padding: 12px; margin-top: 10px; border-radius: 6px; }
    .badge { background: #ffeb3b; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .author-info { font-size: 13px; color: #666; margin-top: 2px; margin-bottom: 10px; }
    #userProfile { background: #e3f2fd; padding: 10px; border-radius: 6px; margin-bottom: 15px; display: none; }
  </style>
</head>
<body>

  <h1 style="color: rgb(245, 240, 242);">디지털 소외 해소 글을 POST하는 공간입니다.</h1>

  <section>
    <h2>로그인</h2>
    <div id="loginArea">
      <button id="googleLoginBtn">구글 계정으로 로그인</button>
    </div>
    <div id="userProfile">
      <p style="margin:0;"><strong id="userName"></strong> (<span id="userEmail"></span>) 님 환영합니다!</p>
      <button id="logoutBtn" style="margin-top: 8px; padding: 4px 8px; font-size: 12px;">로그아웃</button>
    </div>
  </section>

  <section id="writeSection" style="display: none;">
    <h2> 새 Post 작성</h2>
    
    <label>카테고리</label>
<select id="categorySelect">
  <option value="키오스크">키오스크</option>
  <option value="예매 방법">예매 방법</option>
  <option value="모바일 앱 결제">모바일 앱 결제</option>
  <option value="PC앱 결제">PC앱 결제</option>
  <option value="direct">직접 입력</option>
</select>

<input type="text" id="customCategoryInput" placeholder="카테고리를 직접 입력하세요" style="display: none; margin-top: -5px;">

    <label>제목</label>
    <input type="text" id="titleInput" placeholder="제목을 입력하세요">

    <label>본문</label>
    <textarea id="bodyInput" rows="4" placeholder="내용을 입력하세요"></textarea>

    <button id="submitBtn">작성 완료 (검증 요청)</button>
  </section>

  <section id="adminSection" style="display: none; background-color: #fffde7;">
    <h2> [내 DB] 승인 대기 목록 (관리자 검증)</h2>
    <div id="pendingPosts">로딩 중...</div>
    </section>

  <section style="background-color: #f1f8e9;">
    <h2>[메인 DB] 게시된 Post 목록</h2>
    <div id="publishedPosts">로딩 중...</div>
  </section>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      deleteDoc, 
      doc, 
      onSnapshot, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    // 4. Realtime Database (친구 DB - 안드로이드 앱 글 수신용)
    import { 
      getDatabase, 
      ref, 
      onValue, 
      push, 
      remove 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    // Firebase 프로젝트 설정
    const myFirebaseConfig = {
        apiKey: "AIzaSyBxN9gTuUPZRmeE-PARNR8zDouqVkDuOPk",
        authDomain: "clepostinf.firebaseapp.com",
        projectId: "clepostinf",
        storageBucket: "clepostinf.firebasestorage.app",
        messagingSenderId: "4251713734",
        appId: "1:4251713734:web:cee443f29ace413cb097c7",
        measurementId: "G-WDPTRC2H9M"
    };

    // Main Firebase
    const friendFirebaseConfig = {
      apiKey: "AIzaSyAKPMun3QqXJ9T0F88sJmDVg4P41yfzalw",
      authDomain: "tlqkfzz.firebaseapp.com",
      databaseURL: "https://tlqkfzz-default-rtdb.firebaseio.com",
      projectId: "tlqkfzz",
      storageBucket: "tlqkfzz.appspot.com",
      messagingSenderId: "84615874589",
      appId: "1:84615874589:android:a6adda0376e3a83b145ef4"
    };
    const friendApp = initializeApp(friendFirebaseConfig, "friendApp");
    const friendRealtimeDb = getDatabase(friendApp);

    const postsRef = ref(friendRealtimeDb, 'posts');

    // Firebase 앱 & DB 초기화
    const myApp = initializeApp(myFirebaseConfig, "myApp");
    

    const auth = getAuth(myApp);
    const myDb = getFirestore(myApp);
    const friendDb = getFirestore(friendApp);

    let currentUser = null; // 현재 로그인된 사용자 정보 저장 변수

    // HTML 요소를 가져옵니다.
    const googleLoginBtn = document.getElementById('googleLoginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const loginArea = document.getElementById('loginArea');
    const userProfile = document.getElementById('userProfile');
    const userNameSpan = document.getElementById('userName');
    const userEmailSpan = document.getElementById('userEmail');
    const writeSection = document.getElementById('writeSection');

    const categoryInput = document.getElementById('categoryInput');
    const titleInput = document.getElementById('titleInput');
    const bodyInput = document.getElementById('bodyInput');
    const submitBtn = document.getElementById('submitBtn');

    const pendingPostsDiv = document.getElementById('pendingPosts');
    const publishedPostsDiv = document.getElementById('publishedPosts');

    const categorySelect = document.getElementById('categorySelect');
    const customCategoryInput = document.getElementById('customCategoryInput');

    const ADMIN_EMAIL = "h_s_posan25_1219@dge.go.kr";

    const adminSection = document.getElementById('adminSection');

    let unsubscribePendingPosts = null; // 대기글 리스너 해제용 변수


// -------------------------------------------------------------
// 로그인 상태 변화 감지
// -------------------------------------------------------------
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        userNameSpan.textContent = user.displayName || "이름없음";
        userEmailSpan.textContent = user.email || "";
        loginArea.style.display = 'none';
        userProfile.style.display = 'block';
        writeSection.style.display = 'block';

        //  로그인한 유저가 관리자인지 체크!
        if (user.email === ADMIN_EMAIL) {
          adminSection.style.display = 'block'; // 관리자 UI 보이기
          listenToPendingPosts(); // 관리자일 때만 승인 대기글 수신 시작
        } else {
          adminSection.style.display = 'none'; // 일반 유저는 관리자 UI 숨기기
          if (unsubscribePendingPosts) unsubscribePendingPosts(); // 대기글 수신 중단
        }

      } else {
        currentUser = null;
        loginArea.style.display = 'block';
        userProfile.style.display = 'none';
        writeSection.style.display = 'none';
        adminSection.style.display = 'none'; // 로그아웃 시 관리자 UI 숨기기
        if (unsubscribePendingPosts) unsubscribePendingPosts();
      }
    });


    // -------------------------------------------------------------
    // [관리자 전용] 대기 중인 Post 목록 조회 함수
    // -------------------------------------------------------------
    function listenToPendingPosts() {
      // 이미 수신기가 켜져 있다면 중복 실행 방지
      if (unsubscribePendingPosts) unsubscribePendingPosts();

      unsubscribePendingPosts = onSnapshot(collection(myDb, "pending_posts"), (snapshot) => {
        pendingPostsDiv.innerHTML = '';
        if (snapshot.empty) {
          pendingPostsDiv.innerHTML = '<p>대기 중인 Post가 없습니다.</p>';
          return;
        }

        snapshot.forEach((docSnap) => {
          const post = docSnap.data();
          const postId = docSnap.id;

          const card = document.createElement('div');
          card.className = 'post-card';
          card.innerHTML = `
            <span class="badge">[${post.category}]</span> <strong>${post.title}</strong>
            <div class="author-info">작성자: ${post.author} (${post.authEmail})</div>
            <p>${post.body}</p>
            <div style="margin-top: 10px;">
              <button class="approve-btn" style="background-color: #e8f5e9; border: 1px solid #81c784; color: #2e7d32;">
                [승인하여 Main DB로 전송]
              </button>
              <button class="reject-btn" style="background-color: #ffebee; border: 1px solid #e57373; color: #c62828; margin-left: 8px;">
                [거절 (대기 명단에서 삭제)]
              </button>
            </div>
          `;

          card.querySelector('.approve-btn').addEventListener('click', async () => {
            await approveAndTransfer(postId, post);
          });
          card.querySelector('.reject-btn').addEventListener('click', async () => {
            if (confirm(`'${post.title}' 글을 대기 목록에서 삭제하시겠습니까?`)) {
              await rejectPost(postId);
            }
          });

          pendingPostsDiv.appendChild(card);
        });
      });
    }
    async function rejectPost(myPostId) {
      try {
        await deleteDoc(doc(myDb, "pending_posts", myPostId));
        alert("게시글이 대기 목록에서 삭제되었습니다.");
      } catch (error) {
        console.error("거절/삭제 실패:", error);
        alert("삭제 중 오류가 발생했습니다.");
      }
    }

    categorySelect.addEventListener('change', (e) => {
      if (e.target.value === 'direct') {
        customCategoryInput.style.display = 'block';
        customCategoryInput.focus();
      } else {
        customCategoryInput.style.display = 'none';
        customCategoryInput.value = ''; // 입력창 초기화
      }
    });

    // 구글 로그인 / 로그아웃 처리
    const provider = new GoogleAuthProvider();

    googleLoginBtn.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        console.error("로그인 실패:", error);
        alert("로그인 중 오류가 발생했습니다.");
      }
    });

    logoutBtn.addEventListener('click', () => signOut(auth));

    // 로그인 상태 변화 감지
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        userNameSpan.textContent = user.displayName || "이름없음";
        userEmailSpan.textContent = user.email || "";
        loginArea.style.display = 'none';
        userProfile.style.display = 'block';
        writeSection.style.display = 'block';
      } else {
        currentUser = null;
        loginArea.style.display = 'block';
        userProfile.style.display = 'none';
        writeSection.style.display = 'none';
      }
    });


    //  Post 작성 (내 DB의 'pending_posts' 컬렉션에 저장)
    submitBtn.addEventListener('click', async () => {
      if (!currentUser) {
        alert("로그인이 필요합니다.");
        return;
      }

      const title = titleInput.value.trim();
      const body = bodyInput.value.trim();

      //  최종 카테고리 값 구하기
      let finalCategory = categorySelect.value;
      if (finalCategory === 'direct') {
        finalCategory = customCategoryInput.value.trim();
      }

      if (!finalCategory) {
        alert("카테고리를 입력하거나 선택해주세요.");
        return;
      }

      if (!title || !body) {
        alert("제목과 내용을 입력해주세요.");
        return;
      }

      // Firestore에 저장할 Post 객체
      const postData = {
        uid: currentUser.uid,
        author: currentUser.displayName || "익명",
        authEmail: currentUser.email || "",
        title: title,
        body: body,
        category: finalCategory, // 입력받은 최종 카테고리 적용!
        status: "pending",
        starCount: 0,
        stars: {},
        createdAt: serverTimestamp()
      };

      try {
        await addDoc(collection(myDb, "pending_posts"), postData);
        alert("내 DB에 승인 대기글로 등록되었습니다!");

        // 입력 폼 초기화
        titleInput.value = '';
        bodyInput.value = '';
        customCategoryInput.value = '';
        categorySelect.value = '키오스크';
        customCategoryInput.style.display = 'none';
      } catch (error) {
        console.error("글 저장 실패:", error);
      }
    });


    // -------------------------------------------------------------
    // 4. [내 DB] 대기 중인 Post 목록 조회 및 승인 처리
    // -------------------------------------------------------------
    onSnapshot(collection(myDb, "pending_posts"), (snapshot) => {
      pendingPostsDiv.innerHTML = '';
      if (snapshot.empty) {
        pendingPostsDiv.innerHTML = '<p>대기 중인 Post가 없습니다.</p>';
        return;
      }

      snapshot.forEach((docSnap) => {
        const post = docSnap.data();
        const postId = docSnap.id;

        const card = document.createElement('div');
        card.className = 'post-card';
        card.innerHTML = `
          <span class="badge">[${post.category}]</span> <strong>${post.title}</strong>
          <div class="author-info">작성자: ${post.author} (${post.authEmail})</div>
          <p>${post.body}</p>
          <button class="approve-btn" data-id="${postId}">[승인하여 Main DB로 전송]</button>
        `;

        // 버튼 클릭에 전체 Post 데이터 전달을 위해 데이터 보관
        card.querySelector('.approve-btn').addEventListener('click', async () => {
          await approveAndTransfer(postId, post);
        });

        pendingPostsDiv.appendChild(card);
      });
    });

    // 승인 함수: 내 DB에서 삭제 후 -> 친구 DB의 'posts' 컬렉션에 이관
    async function approveAndTransfer(myPostId, postData) {
      try {
        // 1. 전송할 데이터 안전하게 구성 (undefined 방지 및 author 변경)
        const approvedPost = {
          uid: postData.uid || "",
          author: "관리자", //  작성자를 '관리자'로 변경
          authEmail: postData.authEmail || "",
          title: postData.title || "",
          body: postData.body || "",
          category: postData.category || "기타",
          status: "approved",
          createdAt: Date.now() //  Realtime DB용 숫자 타임스탬프
        };
      
        // 2. 친구 Realtime DB의 'posts' 경로로 전송
        const friendPostsRef = ref(friendRealtimeDb, 'posts');
        await push(friendPostsRef, approvedPost);
      
        // 3. 내 Firestore DB의 대기 목록에서 삭제
        await deleteDoc(doc(myDb, "pending_posts", myPostId));
      
        alert("성공적으로 승인되어 게시되었습니다!");
      } catch (error) {
        console.error("이관 실패 상세 원인:", error);
        alert(`승인 이관 중 오류 발생: ${error.message}`);
      }
    }


    // -------------------------------------------------------------
    // 5. [친구 DB] 최종 승인/게시된 Post 목록 불러오기
    // -------------------------------------------------------------
    onValue(postsRef, (snapshot) => {
      publishedPostsDiv.innerHTML = '';
      const data = snapshot.val();

      if (!data) {
        publishedPostsDiv.innerHTML = '<p>게시된 Post가 없습니다.</p>';
        return;
      }

      // Realtime Database의 객체 형태 데이터를 반복문 처리
      Object.keys(data).forEach((key) => {
        const post = data[key];

        publishedPostsDiv.innerHTML += `
          <div class="post-card">
            <span class="badge">[${post.category || '기타'}]</span> <strong>${post.title || '제목 없음'}</strong>
            <div class="author-info">작성자: ${post.author || '익명'}</div>
            <p>${post.body || ''}</p>
          </div>
        `;
      });
    });
  </script>
</body>
</html>
